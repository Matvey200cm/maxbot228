version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maxbot_db
    environment:
      POSTGRES_DB: maxbot_db
      POSTGRES_USER: maxbot
      POSTGRES_PASSWORD: maxbot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: maxbot_api
    ports:
      - "8000:8000"
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_ADMIN_ID: ${BOT_ADMIN_ID:-0}
      DATABASE_URL: postgresql+asyncpg://maxbot:maxbot_password@postgres:5432/maxbot_db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      REMINDER_CHECK_INTERVAL: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    container_name: maxbot_bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_ADMIN_ID: ${BOT_ADMIN_ID:-0}
      DATABASE_URL: postgresql+asyncpg://maxbot:maxbot_password@postgres:5432/maxbot_db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      REMINDER_CHECK_INTERVAL: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
